name: Build Android Test APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply NADMO AI app identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode assets/nadmo_icon_256.jpg.b64 > android/app/src/main/res/drawable-nodpi/nadmo_icon.jpg
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/nadmo_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/nadmo_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 11/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.1.0"/' android/app/build.gradle

      - name: Build test APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Checksum
        run: sha256sum android/app/build/outputs/apk/debug/app-debug.apk > NADMO-AI-v1.1.0-test.sha256

      - name: Upload test APK
        uses: actions/upload-artifact@v7
        with:
          name: NADMO-AI-v1.1.0-test
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            NADMO-AI-v1.1.0-test.sha256
          if-no-files-found: error
          retention-days: 30
