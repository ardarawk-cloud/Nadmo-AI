name: Bootstrap NADMO AI Source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.source-parts/**'
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore source package
        shell: bash
        run: |
          set -euo pipefail
          cat .source-parts/part-* > /tmp/nadmo-source.b64
          base64 --decode /tmp/nadmo-source.b64 > /tmp/nadmo-source.zip
          mkdir -p /tmp/nadmo-unpack
          unzip -q /tmp/nadmo-source.zip -d /tmp/nadmo-unpack
          rsync -a --exclude='.github/' /tmp/nadmo-unpack/nadmo-ai/ ./
          rm -rf .source-parts

      - name: Commit expanded project
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Import NADMO AI Android project'
          git push origin main
