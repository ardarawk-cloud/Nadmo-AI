name: Build NADMO AI Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: npm install

      - name: Validate JavaScript
        run: npm run check

      - name: Create Android project
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply release identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/res/drawable-nodpi
          base64 --decode assets/nadmo_icon_256.jpg.b64 > android/app/src/main/res/drawable-nodpi/nadmo_icon.jpg
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@drawable/nadmo_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:roundIcon="@mipmap/ic_launcher_round"#android:roundIcon="@drawable/nadmo_icon"#' android/app/src/main/AndroidManifest.xml
          sed -i 's/versionCode 1/versionCode 16/' android/app/build.gradle
          sed -i 's/versionName "1.0"/versionName "1.3.0"/' android/app/build.gradle

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Collect Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          SRC="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          mkdir -p signing-tools/lib
          cp "$SRC/apksigner" signing-tools/apksigner
          cp "$SRC/zipalign" signing-tools/zipalign
          cp "$SRC/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          chmod +x signing-tools/apksigner signing-tools/zipalign

      - name: Check release output
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          sha256sum "$APK" > NADMO-AI-v1.3.0-unsigned.sha256

      - name: Upload unsigned release and signing tools
        uses: actions/upload-artifact@v7
        with:
          name: NADMO-AI-v1.3.0-release-unsigned
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            NADMO-AI-v1.3.0-unsigned.sha256
            signing-tools/
          if-no-files-found: error
          retention-days: 30
